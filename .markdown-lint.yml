# See: https://github.com/DavidAnson/markdownlint

# Unordered list style
MD004:
  style: dash

# Line length 80 is far too short for badge URLs
MD013: false

# Inline HTML (badges use <p>/<a>/<img>)
MD033:
  allowed_elements:
    - p
    - a
    - img

# Ordered list item prefix
MD029:
  style: one

# Spaces after list markers
MD030:
  ul_single: 1
  ol_single: 1
  ul_multi: 1
  ol_multi: 1

# Code block style
MD046:
  style: fenced
